name: Codex PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
env:
  REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
jobs:
  execute:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    concurrency:
      group: codex-execute-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export base skill and prebuild snapshot
        id: prepare
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trusted-review"
          git archive "$REVIEW_BASE_SHA" .agents/skills/code-review | tar -x -C "$RUNNER_TEMP/trusted-review"
          node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-review.mjs" prepare "$RUNNER_TEMP/codex-pr-review" "$GITHUB_WORKSPACE" "$REVIEW_BASE_SHA" "$REVIEW_HEAD_SHA"
      - name: Check credential availability
        if: steps.prepare.outputs.has_text == 'true'
        env:
          HAS_CREDENTIAL: ${{ secrets.OPENAI_API_KEY != '' }}
        run: test "$HAS_CREDENTIAL" = true || { echo '::error::OPENAI_API_KEY is not configured.'; exit 1; }
      - name: Call trusted code-review skill
        if: steps.prepare.outputs.has_text == 'true'
        id: codex
        timeout-minutes: 33
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5 # v1
        env:
          TMPDIR: ${{ runner.temp }}/codex-pr-review/runtime-tmp
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: https://gptapi001.huasu.org/v1/responses
          codex-version: 0.167.1
          codex-home: ${{ runner.temp }}/codex-pr-review/codex-home
          working-directory: ${{ runner.temp }}/codex-pr-review/controller
          model: gpt-6.1-sol
          effort: low
          permission-profile: review-temp
          safety-strategy: drop-sudo
          prompt-file: ${{ runner.temp }}/codex-pr-review/private/prompt.md
          output-schema-file: ${{ runner.temp }}/codex-pr-review/skill/references/ci-review-result.schema.json
          output-file: ${{ runner.temp }}/codex-pr-review/private/final.json
      # Fixed infrastructure only after Codex; never execute checkout scripts.
      - name: Seal allowlisted evidence
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ACTION_OUTCOME: ${{ steps.codex.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const root = path.join(process.env.RUNNER_TEMP, 'codex-pr-review');
            if (!fs.existsSync(path.join(root, 'private'))) {
              core.setFailed('Trusted preparation failed; no completed review exists.'); return;
            }
            if (fs.existsSync(path.join(root, 'public/observer-complete'))) return;
            fs.writeFileSync(path.join(root, 'private/outcome.json'), JSON.stringify({action: process.env.ACTION_OUTCOME}));
            for (let i = 0; i < 40; i++) {
              if (fs.existsSync(path.join(root, 'public/observer-complete'))) return;
              await new Promise(resolve => setTimeout(resolve, 500));
            }
            core.setFailed('Observer did not seal evidence; review is incomplete.');
      - name: Upload public execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-review-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-pr-review/public/
          if-no-files-found: error
          retention-days: 7
  review:
    needs: execute
    if: always() && !cancelled() && needs.execute.result != 'cancelled' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Export trusted base tools
        run: |
          mkdir -p "$RUNNER_TEMP/trusted-review"
          git archive "$REVIEW_BASE_SHA" .agents/skills/code-review | tar -x -C "$RUNNER_TEMP/trusted-review"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: codex-review-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-input
      - name: Validate runtime evidence and machine result
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-review.mjs" assess "$RUNNER_TEMP/review-input" "$RUNNER_TEMP/review-report"
      - name: Prepare optional online summary
        id: delivery
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const tool = path.join(process.env.RUNNER_TEMP, 'trusted-review/.agents/skills/code-review/scripts/ci-review.mjs');
            const { assessReview, prepareDelivery } = await import(pathToFileURL(tool).href);
            const dir = path.join(process.env.RUNNER_TEMP, 'review-report');
            if (!fs.existsSync(path.join(dir, 'result.json'))) assessReview(path.join(process.env.RUNNER_TEMP, 'missing-evidence'), dir, {
              base: process.env.REVIEW_BASE_SHA, head: process.env.REVIEW_HEAD_SHA, run: String(context.runId), attempt: process.env.GITHUB_RUN_ATTEMPT,
            });
            const result = JSON.parse(fs.readFileSync(path.join(dir, 'result.json'), 'utf8'));
            // An upgrade PR still runs the trusted tools exported from its old base.
            // Keep that base's result and publisher contract; never load head tools here.
            if (typeof prepareDelivery !== 'function') {
              if (result.version !== undefined) { core.setFailed('Unsupported trusted delivery contract'); return; }
              fs.writeFileSync(path.join(dir, 'delivery.json'), JSON.stringify({
                mode: 'legacy', required: false, parts: 0, url: null, error: null,
              }));
              core.setOutput('parts', 0);
              core.info('Trusted base uses the legacy report contract; online summary is not applicable.');
              return;
            }
            const delivery = await prepareDelivery(github, context, result, dir);
            core.setOutput('parts', delivery.parts);
            if (delivery.error) core.setFailed(delivery.error);
      - name: Write online summary 1
        if: always() && steps.delivery.outputs.parts >= 1
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 1
      - name: Write online summary 2
        if: always() && steps.delivery.outputs.parts >= 2
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 2
      - name: Write online summary 3
        if: always() && steps.delivery.outputs.parts >= 3
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 3
      - name: Write online summary 4
        if: always() && steps.delivery.outputs.parts >= 4
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 4
      - name: Write online summary 5
        if: always() && steps.delivery.outputs.parts >= 5
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 5
      - name: Write online summary 6
        if: always() && steps.delivery.outputs.parts >= 6
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 6
      - name: Write online summary 7
        if: always() && steps.delivery.outputs.parts >= 7
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 7
      - name: Write online summary 8
        if: always() && steps.delivery.outputs.parts >= 8
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 8
      - name: Write online summary 9
        if: always() && steps.delivery.outputs.parts >= 9
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 9
      - name: Write online summary 10
        if: always() && steps.delivery.outputs.parts >= 10
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 10
      - name: Write online summary 11
        if: always() && steps.delivery.outputs.parts >= 11
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 11
      - name: Write online summary 12
        if: always() && steps.delivery.outputs.parts >= 12
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 12
      - name: Write online summary 13
        if: always() && steps.delivery.outputs.parts >= 13
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 13
      - name: Write online summary 14
        if: always() && steps.delivery.outputs.parts >= 14
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 14
      - name: Write online summary 15
        if: always() && steps.delivery.outputs.parts >= 15
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 15
      - name: Write online summary 16
        if: always() && steps.delivery.outputs.parts >= 16
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 16
      - name: Write online summary 17
        if: always() && steps.delivery.outputs.parts >= 17
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 17
      - name: Write online summary 18
        if: always() && steps.delivery.outputs.parts >= 18
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 18
      - name: Write online summary 19
        if: always() && steps.delivery.outputs.parts >= 19
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 19
      - name: Write online summary 20
        if: always() && steps.delivery.outputs.parts >= 20
        run: node "$RUNNER_TEMP/trusted-review/.agents/skills/code-review/scripts/ci-summary.mjs" "$RUNNER_TEMP/review-report" 20
      - name: Confirm online delivery
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const dir = path.join(process.env.RUNNER_TEMP, 'review-report');
            const file = path.join(dir, 'delivery.json');
            if (!fs.existsSync(file)) { core.setFailed('Delivery metadata missing'); return; }
            const delivery = JSON.parse(fs.readFileSync(file, 'utf8'));
            delivery.confirmed = !delivery.error && !fs.existsSync(path.join(dir, 'summary-error')) &&
              Array.from({ length: delivery.parts }, (_, i) => fs.existsSync(path.join(dir, 'summary-' + (i + 1) + '.ok'))).every(Boolean);
            if (!delivery.confirmed) { delivery.error ||= 'Online summary delivery incomplete'; core.setFailed(delivery.error); }
            fs.writeFileSync(file, JSON.stringify(delivery));
      - name: Upload machine result including failure diagnostics
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-review-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-report/
          if-no-files-found: error
          retention-days: 7
  comment:
    needs: [execute, review]
    if: always() && !cancelled() && needs.execute.result != 'cancelled' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: codex-publish-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Export trusted publisher
        run: |
          mkdir -p "$RUNNER_TEMP/trusted-review"
          git archive "$REVIEW_BASE_SHA" .agents/skills/code-review | tar -x -C "$RUNNER_TEMP/trusted-review"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: codex-review-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-report
      - name: Publish current head using trusted skill publisher
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const trusted = path.join(process.env.RUNNER_TEMP, 'trusted-review/.agents/skills/code-review/scripts/ci-review.mjs');
            const { assessReview, publish, prepareDelivery } = await import(pathToFileURL(trusted).href);
            const dir = path.join(process.env.RUNNER_TEMP, 'review-report');
            if (!fs.existsSync(path.join(dir, 'result.json'))) {
              assessReview(path.join(process.env.RUNNER_TEMP, 'missing-evidence'), dir, {
                base: process.env.REVIEW_BASE_SHA, head: process.env.REVIEW_HEAD_SHA,
                run: String(context.runId), attempt: process.env.GITHUB_RUN_ATTEMPT,
              });
            }
            const result = JSON.parse(fs.readFileSync(path.join(dir, 'result.json'), 'utf8'));
            const deliveryFile = path.join(dir, 'delivery.json');
            const delivery = fs.existsSync(deliveryFile) ? JSON.parse(fs.readFileSync(deliveryFile, 'utf8')) : { error: 'Delivery metadata missing' };
            if (result.head !== process.env.REVIEW_HEAD_SHA || result.base !== process.env.REVIEW_BASE_SHA ||
                String(result.run) !== String(context.runId) || String(result.attempt) !== process.env.GITHUB_RUN_ATTEMPT) {
              core.setFailed('Report identity mismatch; refusing publication.'); return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (typeof prepareDelivery !== 'function') {
              // Legacy publishers need only a verified result and report. Missing
              // delivery metadata must not suppress the incomplete fallback report.
              if (result.version !== undefined || fs.existsSync(deliveryFile) &&
                  (delivery.mode !== 'legacy' || !delivery.confirmed || delivery.error)) {
                core.setFailed('Legacy publication contract mismatch; refusing publication.'); return;
              }
              const reportFile = path.join(dir, 'report.md');
              if (!fs.existsSync(reportFile)) { core.setFailed('Legacy report missing; refusing publication.'); return; }
              const report = fs.readFileSync(reportFile, 'utf8');
              if (!report.trim()) { core.setFailed('Legacy report empty; refusing publication.'); return; }
              core.info(await publish(github, context, result, report, runUrl));
            } else {
              if (result.version !== 2 || delivery.mode === 'legacy') {
                core.setFailed('Version 2 publication contract mismatch; refusing publication.'); return;
              }
              core.info(await publish(github, context, result, delivery));
            }
            if (delivery.error || !delivery.confirmed) core.setFailed(delivery.error || 'Delivery unconfirmed');
